# Azure Pipelines CI/CD definition
#
# Flow: Build image -> Run smoke tests -> Push to Azure Container Registry
#       -> Deploy to Azure App Service -> Verify health (monitoring gate)
#
# Prerequisites (see README.md "Setup" section):
#   1. Infra deployed (infra/main.bicep) -> gives you ACR + App Service names.
#   2. A Service Connection named 'azure-service-connection' (Azure Resource Manager,
#      scoped to your subscription/resource group) created in Project Settings.
#   3. A Docker Registry Service Connection named 'acr-service-connection' pointing at
#      your ACR (Project Settings > Service connections > Docker Registry > Azure Container Registry).
#   4. Variable group 'azure-cicd-vars' (or edit the variables block below) containing:
#      acrName, resourceGroupName, webAppName, azureSubscription

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - infra/**

pr:
  branches:
    include:
      - main

variables:
  # Prefer a Library variable group in real projects: uncomment and remove the hardcoded values.
  # - group: azure-cicd-vars
  acrName: 'acrmyappdev'                 # <-- set to your ACR name (matches infra output acrLoginServer minus '.azurecr.io')
  resourceGroupName: 'rg-myapp-dev'      # <-- resource group containing ACR + App Service
  webAppName: 'app-myapp-dev'            # <-- App Service name (dev)
  prodWebAppName: 'app-myapp-prod'       # <-- App Service name (prod) - deploy infra/main.bicep with environment=prod, enableStagingSlot=true
  azureSubscription: 'azure-service-connection'  # <-- ARM service connection name
  acrServiceConnection: 'acr-service-connection' # <-- Docker registry service connection name
  imageRepository: 'myapp'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
  # ---------------------------------------------------------------------
  - stage: Build
    displayName: 'Build & Unit Test'
    jobs:
      - job: BuildAndTest
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - script: |
              cd app
              npm install
            displayName: 'Install dependencies'

          - script: |
              cd app
              npm test
            displayName: 'Run smoke tests'

          - task: Docker@2
            displayName: 'Build container image'
            inputs:
              command: build
              Dockerfile: $(dockerfilePath)
              repository: $(imageRepository)
              tags: |
                $(tag)
                latest
              arguments: '--build-arg APP_VERSION=$(tag)'

          # Save the image as a pipeline artifact reference so later stages/agents
          # don't need to rebuild it (they pull it back down via Docker@2 push using the same tags).
          - task: Docker@2
            displayName: 'Push image to Azure Container Registry'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: $(imageRepository)
              command: push
              tags: |
                $(tag)
                latest

  # ---------------------------------------------------------------------
  - stage: DeployDev
    displayName: 'Deploy to App Service (Dev)'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWebApp
        displayName: 'Deploy web app container'
        pool:
          vmImage: $(vmImageName)
        environment: 'dev'   # Azure DevOps Environment - gives you deployment history + approval gates
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to Azure App Service'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(webAppName)
                    containers: '$(acrName).azurecr.io/$(imageRepository):$(tag)'

                - task: AzureCLI@2
                  displayName: 'Post-deploy health check (monitoring gate)'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      URL="https://$(webAppName).azurewebsites.net/health"
                      echo "Checking $URL"
                      for i in $(seq 1 10); do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
                        if [ "$STATUS" = "200" ]; then
                          echo "Health check passed (HTTP $STATUS)"
                          exit 0
                        fi
                        echo "Attempt $i: got HTTP $STATUS, retrying in 10s..."
                        sleep 10
                      done
                      echo "Health check failed after retries - deployment considered unhealthy"
                      exit 1

  # ---------------------------------------------------------------------
  # Deploys to the prod App Service's "staging" slot, health-checks the slot
  # directly (never touching live traffic), then swaps slots for a
  # zero-downtime release. Gated by a manual approval on the 'prod'
  # Environment (configure this in Pipelines > Environments > prod > Approvals).
  - stage: DeployProd
    displayName: 'Deploy to App Service (Prod, slot swap)'
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - deployment: DeployWebAppProd
        displayName: 'Deploy to staging slot and swap'
        pool:
          vmImage: $(vmImageName)
        environment: 'prod'   # add a required approval check here before first use
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy image to prod staging slot'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(prodWebAppName)
                    deployToSlotOrASE: true
                    resourceGroupName: $(resourceGroupName)
                    slotName: 'staging'
                    containers: '$(acrName).azurecr.io/$(imageRepository):$(tag)'

                - task: AzureCLI@2
                  displayName: 'Health check the staging slot (pre-swap)'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      URL="https://$(prodWebAppName)-staging.azurewebsites.net/health"
                      echo "Checking $URL"
                      for i in $(seq 1 10); do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
                        if [ "$STATUS" = "200" ]; then
                          echo "Staging slot healthy (HTTP $STATUS)"
                          exit 0
                        fi
                        echo "Attempt $i: got HTTP $STATUS, retrying in 10s..."
                        sleep 10
                      done
                      echo "Staging slot never became healthy - aborting before swap"
                      exit 1

                - task: AzureAppServiceManage@0
                  displayName: 'Swap staging into production'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    action: 'Swap Slots'
                    webAppName: $(prodWebAppName)
                    resourceGroupName: $(resourceGroupName)
                    sourceSlot: 'staging'

                - task: AzureCLI@2
                  displayName: 'Health check production (post-swap)'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      URL="https://$(prodWebAppName).azurewebsites.net/health"
                      STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
                      if [ "$STATUS" != "200" ]; then
                        echo "Production unhealthy after swap (HTTP $STATUS)."
                        echo "Consider an automatic rollback: re-run 'Swap Slots' with reversed slots, or redeploy the previous tag."
                        exit 1
                      fi
                      echo "Production healthy post-swap (HTTP $STATUS)"

  # ---------------------------------------------------------------------
  - stage: Monitor
    displayName: 'Post-Deployment Monitoring Summary'
    dependsOn:
      - DeployDev
      - DeployProd
    condition: succeeded()
    jobs:
      - job: MonitorSummary
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: 'Query recent Application Insights availability/failures'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                echo "Deployment complete for build $(tag)."
                echo "View live metrics, failures and availability in Application Insights:"
                echo "https://portal.azure.com/#@/resource/subscriptions/<sub-id>/resourceGroups/$(resourceGroupName)/providers/microsoft.insights/components/appi-myapp-dev/overview"
                echo "(Configure alert rules in monitoring/alerts.bicep so failures page you instead of requiring a manual check.)"
